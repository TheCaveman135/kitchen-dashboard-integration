name: Validate integration
on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integration tests against supported Home Assistant
        run: >-
          docker run --rm --entrypoint python3 -v "$PWD:/src:ro"
          ghcr.io/home-assistant/home-assistant:2026.9.2
          /src/tests/ha/test_integration.py
      - name: Verify integration package
        run: python3 tools/package.py
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate custom HACS repository
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands
          comment: false
